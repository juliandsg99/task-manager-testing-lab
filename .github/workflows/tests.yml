name: Test Suite

# "cada push o pull request", sin restringir a ramas puntuales: a diferencia
# de un workflow de deploy, uno de tests debería correr en cualquier rama.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Ejecutar la suite completa de pruebas con cobertura
        run: npx jest --coverage --ci

      - name: Publicar el reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
